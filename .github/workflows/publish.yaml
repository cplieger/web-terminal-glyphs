# Font publish: build the font from the geometry tables, run both test tiers,
# and cut a semver release with the assets attached at creation. This repo
# has no go.mod, jsr.json or Dockerfile, so the central release pipeline never
# runs for it; the release is owned here, the way tool-catalog's is.
#
# Version comes from conventional-commit subjects since the last tag: any `!`
# or BREAKING CHANGE footer is a major, `feat` a minor, `fix`/`perf` a patch,
# anything else no release. Immutable releases are on for the repo, so a
# published asset can never be replaced; a broken release is followed by a
# fixed one, never rewritten.
name: Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - .editorconfig
      - .gitattributes
      - .gitignore
      - renovate.json
  workflow_dispatch:

permissions:
  contents: read

# A superseded run has nothing of its own to cut: the version comes from every
# commit since the last tag and the assets are built from the tree, so the newer
# run publishes a superset. Cancelling also avoids a tag create the Actions token
# cannot perform, since a tag at a commit the branch has moved past needs the
# `workflows` scope whenever the newer commits touch .github/workflows.
concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-26.04
    permissions:
      contents: write # gh release create (tag + assets)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version step reads tags and the commit log
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Build
        run: uv run scripts/build.py
      - name: Geometry invariants
        run: uv run pytest tests/geometry -q
      # --with-deps is needed for firefox and webkit and not for chromium:
      # ubuntu-24.04 carries every shared library chromium links, but webkit
      # needs about forty more (the gstreamer, flite, libmanette and libhyphen
      # sets), and without them both engines fail to launch and take a third of
      # the matrix with them. Chromium is installed separately so a browser that
      # needs no apt transaction does not wait on one.
      - name: Install chromium
        run: uv run playwright install chromium
      - name: Install firefox and webkit
        run: uv run playwright install --with-deps firefox webkit
      - name: Fetch the companion faces
        run: bash scripts/fetch-companion.sh "$RUNNER_TEMP/monaspace"
      - name: Render matrix
        env:
          MONASPACE_DIR: ${{ runner.temp }}/monaspace
        run: uv run pytest tests/render -q --browser chromium --browser firefox --browser webkit
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh
