[project]
name = "web-terminal-glyphs"
version = "0.0.0"
description = "Terminal tiling glyphs drawn for one cell, built as a web font"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
  "fonttools[woff]==4.66.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-playwright==0.9.0",
  "playwright==1.63.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false
